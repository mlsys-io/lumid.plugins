[project]
name = "lumid-plugins"
version = "0.2.2"
description = "lum.id host plugins for FlowMesh and Lumilake (lum.id identity, Runmesh billing, and supplier attribution)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "mlsys-io" },
]
dependencies = [
    "lumid-hooks>=0.2.0",
    "flowmesh-hook>=0.1.2",
    "lumilake-hook @ git+https://github.com/mlsys-io/lumilake_OSS.git@17763400a33af9be62db7aa96ac15c331aeb2190#subdirectory=packages/hook",
    "httpx>=0.27",
    "pydantic>=2.12.3",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/mlsys-io/lumid.flowmesh-plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lumid_flowmesh_plugin",
    "src/lumid_lumilake_plugin",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "flowmesh_hook"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lumilake_hook"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lumilake"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lumilake_server.*"
ignore_missing_imports = true
